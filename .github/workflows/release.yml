name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar czf gutcheck-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release gutcheck
      - uses: softprops/action-gh-release@v2
        with:
          files: gutcheck-*.tar.gz
  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release download ${{ github.ref_name }} -R ${{ github.repository }} -p '*.tar.gz'
      - run: sha256sum *.tar.gz > SHA256SUMS
      - run: gh release upload ${{ github.ref_name }} SHA256SUMS -R ${{ github.repository }} --clobber
